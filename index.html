<!DOCTYPE html>
<html>
<head>
  <title>ML Dashboard</title>

  <style>
    body{
      font-family: Arial;
      padding: 40px;
      background:#f5f5f5;
    }

    .container{
      background:white;
      padding:30px;
      border-radius:10px;
      width:400px;
      margin:auto;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    select, button{
      width:100%;
      padding:10px;
      margin-top:10px;
      margin-bottom:20px;
    }

    #result{
      background:#eee;
      padding:15px;
      border-radius:5px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>ML Model Dashboard</h1>

<label>Select Model</label>

<select id="model">
  <option value="cnn">CNN</option>
  <option value="resnet">ResNet</option>
  <option value="bert">BERT</option>
</select>

<label>Select Dataset</label>

<select id="dataset">
  <option value="mnist">MNIST</option>
  <option value="cifar10">CIFAR-10</option>
  <option value="imdb">IMDB</option>
</select>

<button onclick="runModel()">
Run Model
</button>

<div id="result">
Results will appear here
</div>

</div>

<script>

async function runModel(){

    const model =
      document.getElementById("model").value;

    const dataset =
      document.getElementById("dataset").value;

    const response = await fetch(
      "https://badarmaqsood786-ml-model-backend.hf.space/run",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          model:model,
          dataset:dataset
        })
      }
    );

    const data = await response.json();

    document.getElementById("result").innerHTML = `
      <h3>Results</h3>
      <p><b>Model:</b> ${data.model}</p>
      <p><b>Dataset:</b> ${data.dataset}</p>
      <p><b>Accuracy:</b> ${data.accuracy}</p>
    `;
}

</script>

</body>
</html>
