<!DOCTYPE html>
<html>
<head>
  <title>ML Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      font-family: Arial;
      padding: 40px;
      background:#f5f5f5;
    }

    .container{
      background:white;
      padding:30px;
      border-radius:10px;
      width:450px;
      margin:auto;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    select, button{
      width:100%;
      padding:10px;
      margin-top:10px;
      margin-bottom:20px;
    }

    button{
      cursor:pointer;
      font-weight:bold;
    }

    #result{
      background:#eee;
      padding:15px;
      border-radius:5px;
      margin-bottom:20px;
    }

    canvas{
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>ML Model Dashboard</h1>

<label>Select Model</label>

<select id="model">
  <option value="cnn">CNN</option>
  <option value="resnet">ResNet</option>
  <option value="bert">BERT</option>
</select>

<label>Select Dataset</label>

<select id="dataset">
  <option value="mnist">MNIST</option>
  <option value="cifar10">CIFAR-10</option>
  <option value="imdb">IMDB</option>
</select>

<button onclick="runModel()">
Run Model
</button>

<div id="result">
Results will appear here
</div>

<canvas id="metricsChart"></canvas>

</div>

<script>

let chart = null;

async function runModel(){

    const model =
      document.getElementById("model").value;

    const dataset =
      document.getElementById("dataset").value;

    document.getElementById("result").innerHTML =
      "Running model... please wait";

    const response = await fetch(
      "https://badarmaqsood786-ml-model-backend.hf.space/run",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          model:model,
          dataset:dataset
        })
      }
    );

    const data = await response.json();

    if(data.error){
      document.getElementById("result").innerHTML =
        `<p><b>Error:</b> ${data.error}</p>`;
      return;
    }

    document.getElementById("result").innerHTML = `
      <h3>Results</h3>
      <p><b>Model:</b> ${data.model}</p>
      <p><b>Dataset:</b> ${data.dataset}</p>
      <p><b>Accuracy:</b> ${data.accuracy}%</p>
      <p><b>Precision:</b> ${data.precision}%</p>
      <p><b>Recall:</b> ${data.recall}%</p>
      <p><b>F1 Score:</b> ${data.f1_score}%</p>
    `;

    if(chart){
      chart.destroy();
    }

    chart = new Chart(document.getElementById("metricsChart"), {
      type: "bar",

      data: {
        labels: [
          "Accuracy",
          "Precision",
          "Recall",
          "F1 Score"
        ],

        datasets: [{
          label: "Performance Metrics",
          data: [
            data.accuracy,
            data.precision,
            data.recall,
            data.f1_score
          ]
        }]
      },

      options: {
        scales: {
          y: {
            beginAtZero: true,
            max: 100
          }
        }
      }
    });
}

</script>

</body>
</html>
